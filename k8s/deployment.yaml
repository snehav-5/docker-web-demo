apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-web-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker-web-demo
  template:
    metadata:
      labels:
        app: docker-web-demo
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/docker-web-demo:1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
